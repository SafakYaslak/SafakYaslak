<svg
    width="1200"
    height="300"
    viewBox="0 0 1200 300"
    xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#080808"/>
            <stop offset="58%" stop-color="#111111"/>
            <stop offset="100%" stop-color="#1d090d"/>
        </linearGradient>

        <linearGradient id="redLine" x1="0" x2="1">
            <stop offset="0%" stop-color="#311016"/>
            <stop offset="50%" stop-color="#8d2635"/>
            <stop offset="100%" stop-color="#311016"/>
        </linearGradient>

        <pattern
            id="grid"
            width="42"
            height="42"
            patternUnits="userSpaceOnUse"
        >
            <path
                d="M 42 0 L 0 0 0 42"
                fill="none"
                stroke="#ffffff"
                stroke-width="0.35"
                opacity="0.055"
            />
        </pattern>

        <filter id="soft">
            <feGaussianBlur stdDeviation="26"/>
        </filter>
    </defs>

    <!-- Background -->
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>

    <!-- Soft burgundy atmosphere -->
    <ellipse
        cx="1010"
        cy="130"
        rx="240"
        ry="120"
        fill="#641823"
        opacity="0.18"
        filter="url(#soft)"
    />

    <!-- Technical geometric elements -->
    <g opacity="0.22" fill="none" stroke="#a7a7a7">
        <circle cx="1010" cy="148" r="72" stroke-width="0.8"/>
        <circle cx="1010" cy="148" r="102" stroke-width="0.4"/>
        <path d="M880 148 H1145" stroke-width="0.5"/>
        <path d="M1010 38 V258" stroke-width="0.5"/>
        <path d="M942 80 L1080 215" stroke-width="0.5"/>
    </g>

    <!-- Moving red accent -->
    <rect
        x="-240"
        y="285"
        width="240"
        height="2"
        fill="url(#redLine)"
    >
        <animate
            attributeName="x"
            values="-240;1200"
            dur="7s"
            repeatCount="indefinite"
        />
    </rect>

    <!-- Main editorial typography -->
    <text
        x="72"
        y="125"
        fill="#f1f1f1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="47"
        font-weight="500"
        letter-spacing="-1"
    >
        Şafak Yaşlak
    </text>

    <text
        x="75"
        y="168"
        fill="#949494"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="400"
        letter-spacing="3"
    >
        COMPUTER VISION / ROBOTICS / EMBEDDED SYSTEMS
    </text>

    <!-- Small editorial index -->
    <text
        x="75"
        y="235"
        fill="#681b27"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        letter-spacing="2"
    >
        ENGINEERING · R&amp;D
    </text>
</svg>
